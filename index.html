<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deluxe | Temperature Monitoring</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#0b1019;color:#f4f7fc}
*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1800px;margin:auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:clamp(24px,3vw,38px);margin:0}h1 span{color:#fa5353}p{color:#a5b2c6}
.badge{background:#202b3d;border-radius:30px;padding:10px 16px;color:#bdc9da;font-size:14px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.summary>div,.card{background:#151e2d;border:1px solid #2a3648;border-radius:15px;padding:16px}
.summary strong{font-size:clamp(19px,3vw,30px);display:block;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{min-width:0}.card h2{font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}
.temp{font-size:clamp(25px,3.1vw,43px);font-weight:bold;letter-spacing:-1px}
.humidity{color:#7ac8ff;margin:6px 0 12px}.status{font-size:12px;font-weight:bold;letter-spacing:.06em}
.normal{color:#50e0a4}.warm{color:#ffc15b}.hot{color:#ff7373}.offline{color:#9ba7b9}
svg{width:100%;height:76px;background:#111827;border-radius:8px;display:block}
small{display:block;color:#8493aa;margin-top:9px}footer{margin-top:20px;color:#a5b2c6;font-size:13px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){body{padding:10px}.grid{gap:8px}.card{padding:10px}.summary{gap:7px}.summary>div{padding:10px}}
</style></head><body>
<header><div><h1><span>DELUXE</span> · Environment Monitor</h1><p>Temperature & humidity | 16 sensor positions</p></div><div class="badge" id="connection">Demo mode · No live connection</div></header>
<section class="summary"><div>Reporting sensors<strong id="active">0 / 16</strong></div><div>Average temperature<strong id="average">—</strong></div><div>High temperature alerts<strong id="alerts">0</strong></div></section>
<main class="grid" id="grid"></main>
<footer><span id="updated">Awaiting live data</span> · Thresholds: warm ≥ 24°C, high ≥ 27°C (editable). Demo values are illustrative, not real readings.</footer>
<script>
"use strict";
// Keep API keys out of this file. Later, point this at your Cloudflare Worker endpoint.
// The endpoint should return: {"sensors":[{"id":"1","name":"Reception","temperature":21.4,"humidity":45,"history":[20.8,21.1,21.4],"updated":"2026-11-04T17:00:00Z"}]}
const DATA_ENDPOINT = "";
const REFRESH_MS = 5 * 60 * 1000;
const NAMES = ["Reception","First Floor East","First Floor West","Second Floor","Meeting Room 1","Meeting Room 2","Office Area","Kitchen","Server Room","Corridor","Sensor 11","Sensor 12","Sensor 13","Sensor 14","Sensor 15","Sensor 16"];
const demo = NAMES.map((name,i)=>({id:String(i+1),name,temperature:i<8?+(20.5+i*.55).toFixed(1):null,humidity:i<8?43+i:null,history:i<8?[20.1+i*.4,20.4+i*.4,20.2+i*.5,20.5+i*.55]:[]}));
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function spark(values){const nums=values.map(Number).filter(Number.isFinite);if(nums.length<2)return '<svg aria-label="No history available"></svg>';
const min=Math.min(...nums)-.5,max=Math.max(...nums)+.5;const points=nums.map((n,i)=>`${(i/(nums.length-1)*100).toFixed(1)},${(65-(n-min)/(max-min)*54).toFixed(1)}`).join(" ");
return `<svg viewBox="0 0 100 76" preserveAspectRatio="none" aria-label="Temperature trend"><polyline points="${points}" fill="none" stroke="#77b9ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function render(data,live){
const byId=new Map((data||[]).map((s,i)=>[String(s.id??i+1),s]));
let active=0,total=0,alerts=0;
document.getElementById("grid").innerHTML=NAMES.map((defaultName,i)=>{
const s=byId.get(String(i+1));const t=s?.temperature==null?null:Number(s.temperature),h=s?.humidity==null?null:Number(s.humidity);
const valid=t!==null&&Number.isFinite(t);if(valid){active++;total+=t;if(t>=27)alerts++}
const state=!valid?"offline":t>=27?"hot":t>=24?"warm":"normal";
const label=!valid?"NO READING":t>=27?"HIGH TEMPERATURE":t>=24?"WARM":"NORMAL";
return `<article class="card"><h2>${safe(s?.name||defaultName)}</h2><div class="temp">${valid?t.toFixed(1)+"°C":"—"}</div><div class="humidity">Humidity: ${h!==null&&Number.isFinite(h)?h.toFixed(0)+"%":"—"}</div><div class="status ${state}">${label}</div><div style="height:10px"></div>${spark(Array.isArray(s?.history)?s.history:[])}<small>${safe(s?.updated?"Updated "+new Date(s.updated).toLocaleString("en-GB"):"Trend / waiting for history")}</small></article>`}).join("");
document.getElementById("active").textContent=`${active} / 16`;
document.getElementById("average").textContent=active?(total/active).toFixed(1)+"°C":"—";
document.getElementById("alerts").textContent=alerts;
document.getElementById("connection").textContent=live?"Connected to data endpoint":"Demo mode · No live connection";
document.getElementById("updated").textContent=live?"Last refreshed: "+new Date().toLocaleString("en-GB"):"Sample data only";
}
async function refresh(){if(!DATA_ENDPOINT){render(demo,false);return}
try{const r=await fetch(DATA_ENDPOINT,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);
const json=await r.json();if(!Array.isArray(json.sensors))throw Error("Invalid response");
render(json.sensors,true)}catch(err){document.getElementById("connection").textContent="Connection error · "+err.message;}}
refresh();setInterval(refresh,REFRESH_MS);
</script></body></html>
