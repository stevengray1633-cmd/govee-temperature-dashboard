name: Update DELUXE Govee readings

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: deluxe-govee-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve temperature and humidity
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
        run: python3 update_govee.py
      - name: Publish data to GitHub Pages
        run: |
          if [ -f sensor-data.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f sensor-data.json
            git commit -m "Update Govee sensor readings"
            git push
          fi
