
name: Test Govee API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-govee:
    runs-on: ubuntu-latest

    steps:
      - name: Check Govee API connection
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("GOVEE_API_KEY", "")
          if not key:
              raise SystemExit("GOVEE_API_KEY secret is missing")

          url = "https://openapi.api.govee.com/router/api/v1/user/devices"
          request = urllib.request.Request(
              url,
              headers={
                  "Govee-API-Key": key,
                  "Content-Type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
                  print("HTTP status:", response.status)
                  print("API response code:", data.get("code"))
                  print("API message:", data.get("message"))
                  devices = data.get("data", [])
                  if isinstance(devices, list):
                      print("Devices returned:", len(devices))
                      for device in devices:
                          print(
                              "Device model:",
                              device.get("sku", "Unknown")
                          )
                  else:
                      print("Unexpected device data format")
          except urllib.error.HTTPError as error:
              print("HTTP error:", error.code)
              raise SystemExit("Govee API request failed")
          PY
