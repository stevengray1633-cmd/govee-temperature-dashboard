
name: Test Govee Live Readings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-govee:
    runs-on: ubuntu-latest
    steps:
      - name: Test temperature and humidity
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          key = os.environ["GOVEE_API_KEY"]
          base = "https://openapi.api.govee.com/router/api/v1"

          def api(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + path,
                  data=body,
                  headers={
                      "Govee-API-Key": key,
                      "Content-Type": "application/json"
                  },
                  method="POST" if payload is not None else "GET"
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          result = api("/user/devices")
          devices = result.get("data", [])
          sensors = [
              d for d in devices
              if d.get("sku") in ("H5179", "H5108")
          ]

          print("Compatible models found:", len(sensors))

          if not sensors:
              raise SystemExit("No matching sensors found")

          sensor = sensors[0]
          result = api("/device/state", {
              "requestId": "deluxe-test",
              "payload": {
                  "sku": sensor["sku"],
                  "device": sensor["device"]
              }
          })

          print("Sensor model:", sensor["sku"])
          print("API response code:", result.get("code"))
          print("API message:", result.get("message"))
          print("Response fields:", list(result.keys()))
          print("Data type:", type(result.get("data")).__name__)
          if isinstance(result.get("data"), dict):
          print("Data fields:", list(result["data"].keys()))
          data = result.get("data", {})
          capabilities = data.get("capabilities", [])

          for cap in capabilities:
              instance = cap.get("instance", "")
              if "temperature" in instance.lower() or "humidity" in instance.lower():
                  print("Reading:", instance, cap.get("state"))

          print("Capabilities returned:", len(capabilities))
          PY
